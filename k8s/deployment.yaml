apiVersion: v1
kind: ConfigMap
metadata:
  name: listing-service-config
data:
  MONGO_URI: "mongodb://listing-mongo:27017/listingdb"
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: listing-service
  template:
    metadata:
      labels:
        app: listing-service
    spec:
      containers:
        - name: listing-service
          image: listing-service:1.0
          imagePullPolicy: Never   # image is built inside minikube's Docker daemon
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: listing-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: listing-service
spec:
  type: NodePort
  selector:
    app: listing-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
